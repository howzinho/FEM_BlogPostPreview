<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <main>
      <div class="preview-box">
        <div class="preview-image-box">
          <img class="preview-image" src="assets/images/illustration-article.svg" />
        </div>
        <div class="tags"><div class="tags-learning">Learning</div></div>
        <div class="date-post">Published 21 Dec 2023</div>
        <div class="post-title">HTML & CSS foundations</div>
        <div class="post-brief">
          <p>
          These languages are the backbone of every website, defining structure, content, and presentation.
          </p>
        </div>
        <div class="post-author">
          <img class="post-author-photo" src="assets/images/image-avatar.webp" /><div class="post-author-name">Greg Hooper</div>
        </div>
      </div>
    </main>

    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by
      <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
